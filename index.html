<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Glassmorphism Forms</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', Arial, sans-serif;
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
            margin: 3rem 0;
        }

        form {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2rem 2.5rem;
            min-width: 320px;
            max-width: 350px;
            width: 100%;
            margin: 0 auto;
            transition: box-shadow 0.3s;
        }

        form:hover {
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.45);
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }

        legend {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3a4b;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.3rem;
            font-weight: 500;
            color: #2d3a4b;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            background: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            margin-bottom: 0;
            transition: border 0.2s;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border: 1.5px solid #7f9cf5;
            outline: none;
        }
        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 1.1rem;
        }

        button {
            margin-top: 1.2rem;
            width: 100%;
            padding: 0.9rem 0;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #7f9cf5 0%, #a1c4fd 100%);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(127, 156, 245, 0.15);
            transition: background 0.2s, box-shadow 0.2s, transform 0.18s cubic-bezier(.4,1.5,.5,1), filter 0.18s;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(127,156,245,0.15);
            transform: translateY(0);
        }
        button:hover, button:focus {
            background: linear-gradient(90deg, #5a7be7 0%, #7f9cf5 100%);
            box-shadow: 0 8px 24px rgba(127, 156, 245, 0.30);
            outline: none;
            transform: translateY(-7px) scale(1.03);
            filter: brightness(1.07);
        }
        button:active {
            transform: translateY(2px) scale(0.98);
            filter: brightness(0.97);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Contact Form -->
        <form id="contactForm" action="/submit-contact" method="POST" autocomplete="on" novalidate>
            <fieldset>
                <legend>Contact Us</legend>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required minlength="2" maxlength="50" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required minlength="10" maxlength="500"></textarea>
                </div>
                <button type="submit">Send</button>
            </fieldset>
        </form>

        <!-- Registration Form -->
        <form id="registerForm" action="/register" method="POST" autocomplete="on" novalidate>
            <fieldset>
                <legend>Register</legend>
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required minlength="4" maxlength="20" pattern="^[a-zA-Z0-9_]+$" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email:</label>
                    <input type="email" id="regEmail" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="100" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password:</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="100" autocomplete="new-password">
                </div>
                <button type="submit">Register</button>
            </fieldset>
        </form>

        <!-- Feedback Form -->
        <form id="feedbackForm" action="/submit-feedback" method="POST" autocomplete="on" novalidate>
            <fieldset>
                <legend>Feedback</legend>
                <div class="form-group">
                    <label for="feedbackEmail">Email (optional):</label>
                    <input type="email" id="feedbackEmail" name="email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="rating">Rating:</label>
                    <select id="rating" name="rating" required>
                        <option value="">Select</option>
                        <option value="1">1 - Poor</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments" required minlength="5" maxlength="300"></textarea>
                </div>
                <button type="submit">Submit Feedback</button>
            </fieldset>
        </form>
    </div>
</body>
